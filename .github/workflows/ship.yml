# Generated by OmniShip from workflow.py. Do not edit directly.
name: Ship
'on':
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
  ship-github-pages:
    name: Ship · GitHub Pages
    needs: build
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: omniship-build-*
        path: .omniship/imports
    - name: Run GitHub Pages
      run: uvx --from omniship==0.2.0 omniship run-node --stage ship --node github-pages --config omniship.yaml --import-artifacts-root .omniship/imports
      env:
        OMNISHIP_REVISION: ${{ github.sha }}
    - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
      with:
        path: .omniship/pages/site
    - name: Deploy GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
  ship-complete:
    name: Ship complete
    needs: ship-github-pages
    runs-on: ubuntu-latest
    steps:
    - run: echo 'ship stage complete'
concurrency:
  group: pages
  cancel-in-progress: true
