# Hand-written: OmniShip (workflow.py) has no scheduled trigger yet.
# Collects fresh GitHub activity every day, commits public/data.json, and then
# dispatches the OmniShip Ship workflow, because pushes made with GITHUB_TOKEN
# do not trigger other workflows.
name: Refresh data
'on':
  schedule:
  - cron: '17 3 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  refresh:
    name: Collect and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      with:
        bun-version: 1.4.2
    - run: bun install --frozen-lockfile
    # Org members and teams are not readable with GITHUB_TOKEN, so the collector
    # uses a token from the org's GitHub App (Members: read).
    - name: Create app token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
      with:
        client-id: ${{ vars.LEADERBOARD_APP_CLIENT_ID }}
        private-key: ${{ secrets.LEADERBOARD_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
    - name: Collect activity
      run: bun run collect
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
    - name: Commit data
      id: commit
      run: |
        if git diff --quiet -- public/data.json; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add public/data.json
        git commit -m "chore(data): refresh leaderboard data"
        git push
        echo "changed=true" >> "$GITHUB_OUTPUT"
    - name: Deploy
      if: steps.commit.outputs.changed == 'true'
      run: gh workflow run ship.yml --ref "$GITHUB_REF_NAME"
      env:
        GH_TOKEN: ${{ github.token }}
