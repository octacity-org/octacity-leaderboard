# Hand-written: OmniShip (workflow.py) has no scheduled trigger yet.
# Collects fresh GitHub activity every hour and force-pushes it as the only
# commit on the `data` branch. The site fetches data.json from that branch at
# runtime, so data updates need no commit on main and no redeploy.
name: Refresh data
'on':
  schedule:
  - cron: '17 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  refresh:
    name: Collect and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      with:
        bun-version: 1.4.2
    - run: bun install --frozen-lockfile
    # Org members and teams are not readable with GITHUB_TOKEN, so the collector
    # uses a token from the org's GitHub App (Members: read).
    - name: Create app token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
      with:
        client-id: ${{ vars.LEADERBOARD_APP_CLIENT_ID }}
        private-key: ${{ secrets.LEADERBOARD_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
    - name: Collect activity
      run: bun run collect
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
    # One parentless commit holding only data.json, so the branch never grows.
    - name: Publish data branch
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        blob=$(git hash-object -w public/data.json)
        tree=$(printf '100644 blob %s\tdata.json\n' "$blob" | git mktree)
        commit=$(git commit-tree "$tree" -m "Refresh leaderboard data")
        git push --force origin "${commit}:refs/heads/data"
